[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubii-words-cloud"
version = "0.1.0"
description = "Discord message collector and API service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.100.0",
    "flask>=3.0.0",
    "mistune>=3.0.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
